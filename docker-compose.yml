services:
  copilot-api:
    image: copilot-api:local
    container_name: copilot-api-local
    restart: unless-stopped
    ports:
      - "4141:4141"
    environment:
      # Optional: set your GitHub token to skip interactive auth.
      GH_TOKEN: ${GH_TOKEN:-}
      # Use host proxy from inside container (macOS Docker Desktop).
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      ALL_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
    volumes:
      - ～/docker/copilot-api:/root/.local/share/copilot-api
